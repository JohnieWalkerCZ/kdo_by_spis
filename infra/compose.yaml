services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${KDO_WEB_PORT:-6767}:3000"
    environment:
      KDO_HOST_KEY: ${KDO_HOST_KEY:?Set KDO_HOST_KEY (projector password)}
      KDO_PUBLIC_URL: ${KDO_PUBLIC_URL:-}
      KDO_TRUST_PROXY: ${KDO_TRUST_PROXY:-false}
    volumes:
      - kdo-data:/data
      # Optional: override questions/people without rebuilding (uncomment and point to a host file).
      # - /path/on/host/data.json:/app/data.json:ro

volumes:
  kdo-data:
