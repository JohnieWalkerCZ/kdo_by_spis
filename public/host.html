<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141112">
  <title>Kdo by nejspíš… · projektor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/kapitan-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="host.js"></script>
</head>
<body>
  <div class="conn" id="conn" hidden>Spojení se serverem ztraceno, připojuji znovu…</div>

  <div class="host">
    <main>
      <section data-screen="login">
        <div class="desk">
          <h1 class="head ruled">Kdo by nejspíš…</h1>
          <form id="loginForm">
            <label class="label" for="key">Heslo projektoru</label>
            <input id="key" class="input" type="password" autocomplete="current-password" required>
            <button class="btn" type="submit">Přihlásit</button>
            <p class="error" id="loginError" role="alert"></p>
          </form>
        </div>
      </section>

      <section data-screen="home" hidden>
        <div class="desk">
          <h1 class="head ruled">Kdo by nejspíš…</h1>
          <button class="btn" id="newGame">Nová hra</button>
          <div class="archive">
            <h2>Odehrané hry</h2>
            <div class="history" id="history"><p class="muted">Zatím žádné.</p></div>
          </div>
        </div>
      </section>

      <section data-screen="lobby" hidden>
        <div class="lobby">
          <h1 class="head title ruled">Kdo by nejspíš…</h1>
          <div class="join">
            <div class="qr"><img id="qr" src="data:," alt="QR kód pro připojení"></div>
            <div class="url">Naskenuj kód nebo otevři<br><b id="joinUrl"></b></div>
          </div>
          <div class="audience">
            <p class="count"><b id="lobbyCount">0</b> v sále</p>
            <div class="names" id="bubbles"></div>
            <p class="hint" id="lobbyHint">Čekáme na první hráče.</p>
          </div>
          <div class="pinbox">
            <div class="pin"><small>PIN do hry</small><span id="lobbyPin"></span></div>
          </div>
        </div>
      </section>

      <section data-screen="question" hidden>
        <div class="meta"><span id="qPos"></span><span>PIN <span id="qPin"></span></span></div>
        <h1 class="head qbig ruled" id="qText"></h1>
        <div class="clockrow">
          <div class="secs" id="ringNum" role="timer"></div>
          <div class="track" id="ring"><i id="ringFill"></i></div>
          <div class="voted"><b id="voted">0</b> z <span id="votedOf">0</span> hlasovalo</div>
        </div>
      </section>

      <section data-screen="results" hidden>
        <div class="meta"><span id="rPos"></span><span>PIN <span id="rPin"></span></span></div>
        <h1 class="head results-q" id="rText"></h1>
        <ol class="ranks" id="rBars"></ol>
      </section>

      <section data-screen="final" hidden>
        <div class="meta"><span>Konec hry</span></div>
        <div class="finale">
          <div class="star">
            <div class="label">Hvězda večera</div>
            <h1 class="head ruled" id="fChamp"></h1>
            <p id="fChampSub"></p>
          </div>
          <ol class="credits" id="fList"></ol>
        </div>
      </section>
    </main>

    <nav class="controls" id="controls" hidden aria-label="Ovládání hry">
      <span id="ctlPhase" class="row"></span>
      <span class="spacer"></span>
      <label><input type="checkbox" id="optSound" checked> Zvuk</label>
      <label><input type="checkbox" id="optAuto"> Ukončit, když hlasují všichni</label>
      <button class="btn small ghost" id="fullscreen" title="Celá obrazovka (F)" aria-label="Celá obrazovka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
      <button class="btn small ghost" id="menuFinish">Ukončit hru</button>
      <button class="btn small ghost" id="menuNew">Nová hra</button>
    </nav>
  </div>
</body>
</html>
