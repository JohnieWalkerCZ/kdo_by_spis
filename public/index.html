<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141112">
  <title>Kdo by nejspíš…</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/kapitan-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="conn" id="conn" hidden>Spojení se ztratilo, připojuji znovu…</div>

  <div class="player">
    <section data-screen="join">
      <div class="hero">
        <h1 class="head big ruled">Kdo by nejspíš…</h1>
        <form id="joinForm" class="stack" autocomplete="off" novalidate>
          <label class="label" for="pin">PIN z plátna</label>
          <input id="pin" class="input pin-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-describedby="joinError" required>
          <button class="btn" type="submit">Připojit se</button>
          <p class="error" id="joinError" role="alert"></p>
        </form>
      </div>
    </section>

    <section data-screen="wait" hidden>
      <div class="hero">
        <div>
          <p class="label">Jsi ve hře jako</p>
          <h2 class="head me ruled" id="waitName"></h2>
        </div>
        <p class="muted">Sleduj plátno, první otázka přijde za chvíli. Hlasování je anonymní.</p>
        <p class="label" id="waitPlayers"></p>
      </div>
    </section>

    <section data-screen="question" hidden>
      <header class="qhead">
        <div class="meta"><span id="qPos"></span><span class="secs" id="qSecs"></span></div>
        <h2 class="head qtext ruled" id="qText"></h2>
        <div class="track" id="qBar" aria-hidden="true"><i></i></div>
        <input id="search" class="input" type="search" placeholder="Najít jméno" aria-label="Najít jméno" enterkeyhint="search" autocomplete="off">
      </header>
      <ul class="people" id="people"></ul>
      <p class="muted" id="noMatch" hidden>Takové jméno ve třídě není.</p>
      <footer class="votebar" id="voteStatus" aria-live="polite"></footer>
    </section>

    <section data-screen="results" hidden>
      <div class="meta"><span id="rPos"></span></div>
      <h2 class="head qtext" id="rText"></h2>
      <ol class="board" id="rBars"></ol>
      <p class="note" id="rMine"></p>
      <p class="label">Další otázka za chvíli</p>
    </section>

    <section data-screen="final" hidden>
      <div class="hero">
        <div>
          <p class="label">Hvězda večera</p>
          <h1 class="head big ruled" id="fChamp"></h1>
        </div>
        <p class="note" id="fHits"></p>
        <p class="muted">Díky za hraní a ať se stužkovák vydaří.</p>
      </div>
    </section>
  </div>
</body>
</html>
